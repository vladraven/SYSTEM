steps:
  - name: Checkout Codebase
    uses: actions/checkout@v4

  - name: Setup PHP 8.3 Environment
    uses: shivammathur/setup-php@v2
    with:
      php-version: '8.3'
      extensions: bcmath, curl, json, mbstring
      coverage: none

  - name: Verify Mandatory Native Extensions
    run: |
      php -m | grep -i bcmath
      php -m | grep -i curl
      php -m | grep -i json
      php -m | grep -i mbstring

  - name: Enforce Zero Composer & No Vendor Dependencies
    run: |
      if [ -d "vendor" ]; then
        echo "ERROR: vendor/ directory detected! MacroRisk 2.0 strictly prohibits third-party vendor dependencies."
        exit 1
      fi
      if [ -f "composer.json" ] || [ -f "composer.lock" ]; then
        echo "ERROR: composer.json or composer.lock detected! Pure Native PHP execution is required."
        exit 1
      fi
      echo "PASS: Zero vendor dependencies confirmed."

  - name: Lint PHP Syntax
    run: |
      find . -type f -name "*.php" -not -path "./storage/*" -exec php -l {} \;

  - name: Initialize JSON Storage Directory Tree
    run: |
      mkdir -p storage/config storage/raw/statcan storage/raw/bank_of_canada storage/raw/open_government storage/series storage/snapshots storage/calculations storage/audit storage/cache
      chmod -R 777 storage

  - name: Run Native Test Suite
    run: |
      if [ -f "tests/run.php" ]; then
        php tests/run.php
      elif [ -f "tests/suite.php" ]; then
        php tests/suite.php
      else
        echo "Notice: Native test suite entry point (tests/run.php or tests/suite.php) not found. Skipping execution."
      fi
